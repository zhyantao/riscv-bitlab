<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RISC-V 速查工具箱</title>
<link rel="stylesheet" href="tufte.css">
<style>
  /* 页面专属布局（基础主题见 tufte.css） */
  .intro p { margin:0 0 12px; line-height:1.7; font-size:14px; }
  .controls { display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:14px; }
  select { padding:7px 30px 7px 12px; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; font-size:12px; }
  .legend span { padding:4px 10px; border:1px solid #c9c7b8; }
  .heading { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  #codec-format-heading { margin:16px 0 12px; gap:8px; line-height:1.5; }
  #codec-format-heading .tag { line-height:1.5; }
  .desc { font-size:14px; line-height:1.6; }
  .scroll { overflow-x:auto; padding:4px 2px 8px; }
  .bit-labels, .bit-row { display:grid; grid-template-columns:repeat(32,minmax(0,1fr)); min-width:1024px; }
  .bit-row { margin-bottom:10px; }
  .field { min-width:0; min-height:68px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; position:relative; }
  .field-name { font:600 13px/1.4 var(--mono); white-space:nowrap; flex-shrink:0; }
  .field.narrow .field-name { writing-mode:vertical-rl; font-size:12px; }
  table { font-size:12px; margin-top:4px; }
  th, td { padding:4px 6px; line-height:1.4; }
  th:nth-child(-n+3), td:nth-child(-n+3) { width:1%; white-space:nowrap; }
  td:last-child { overflow-wrap:anywhere; }
  .notes { margin-top:16px; font-size:13px; line-height:1.8; }
  .example { font-size:13px; line-height:1.9; margin-bottom:0; }
  .codec-controls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:12px 0; font-size:14px; }
  .codec-form { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0; }
  .codec-form label { min-width:6em; font-size:14px; }
  .codec-input { flex:1; min-width:180px; font:14px var(--mono); padding:9px; border:1px solid #b9b7a5; border-radius:2px; background:#fffdf6; color:var(--fg); }
  .codec-error { font-size:13px; line-height:1.6; }
  .codec-summary { font-size:14px; line-height:1.9; overflow-wrap:anywhere; }
  #codec-help { margin:6px 0 0; }
  .codec-bits { display:grid; grid-template-columns:repeat(32,minmax(0,1fr)); min-width:1024px; }
  .codec-bit { padding:4px 0; font:13px var(--mono); cursor:pointer; }
  .codec-bit[data-fixed="true"] { box-shadow:inset 0 -3px #b45309; }
  .field[data-fixed="true"] { border-bottom:3px solid #b45309; }
  .fixed-marker { color:#78350f; background:#f2e9c8; padding:2px 4px; border-radius:2px; font:11px/1.4 var(--mono); max-width:100%; overflow-wrap:anywhere; }
  .field.narrow .fixed-marker { writing-mode:vertical-rl; white-space:nowrap; }
  .codec-pattern { display:grid; grid-template-columns:repeat(32,minmax(0,1fr)); min-width:1024px; }
  .codec-pattern span { text-align:center; font:12px var(--mono); padding:4px 0; color:var(--muted); background:#f7f5ec; }
  .codec-pattern span[data-fixed="true"] { color:#78350f; background:#f2e9c8; font-weight:700; }
  .codec-field-value { font:12px var(--mono); max-width:100%; overflow-wrap:anywhere; }
  .field.narrow .codec-field-value { writing-mode:vertical-rl; white-space:nowrap; }
  #format-reference { padding:14px 0 0; margin-top:12px; border-top:1px solid var(--line); }
  #format-reference > p { margin:0 0 6px; font-size:12px; line-height:1.4; }
  #format-reference > .controls { gap:8px; font-size:13px; }
  #format-reference select { padding:4px 28px 4px 8px; max-width:100%; }
  #format-reference .legend { gap:4px; margin:6px 0; }
  #format-reference .legend span { padding:2px 6px; }
  #formats > .card { margin:0; padding:0; border:0; border-radius:0; }
  #formats .format-details > summary { padding:6px 0; }
  #formats .heading { gap:6px; }
  #formats h2 { font-size:14px; margin:0 0 8px; }
  #formats .tag { padding:1px 6px; font-size:11px; }
  #formats .desc { font-size:12px; line-height:1.4; margin:4px 0; }
  #formats .scroll { padding:2px 0 4px; }
  #formats .bit-row { margin-bottom:0; }
  #formats .field { min-height:48px; padding:4px; gap:3px; }
  #formats .notes { margin-top:6px; padding:6px 8px; font-size:12px; line-height:1.4; }
  #formats .example { margin:6px 0 8px; font-size:12px; line-height:1.5; }
  .operation-code { margin:0 0 8px; padding:10px 12px; border:1px solid var(--line); border-radius:2px; background:#f7f4ea; white-space:pre-wrap; overflow-wrap:anywhere; font:12px/1.6 var(--mono); }
  .operation-code:empty { display:none; }
  .operation-code code { background:none; padding:0; font:inherit; }
  .format-details > summary { cursor:pointer; }
  .format-details > summary .heading { display:inline-flex; flex-wrap:wrap; margin:0; vertical-align:middle; }
  .format-details[open] > summary { margin-bottom:4px; }
  @media (max-width:600px) { main { padding:12px; } .card, .intro { padding:14px; } }
</style>

<body>
<header>
  <h1>RISC-V 速查工具箱</h1>
  <nav aria-label="页面导航">
    <a href="index.html">寄存器位域</a>
    <a href="instructions.html" aria-current="page">指令编码</a>
    <a href="traps.html">异常与中断</a>

<main>
  <section id="instruction-card" class="card" aria-labelledby="codec-title">
    <h2 id="codec-title">汇编 / 反汇编</h2>
    <p class="desc">单条指令、32 位机器码与位域双向联动，按 RISC-V ISA 编码规则进行汇编和反汇编。</p>
    <div class="codec-controls">
      <label for="codec-xlen">架构</label>
      <select id="codec-xlen"><option value="64">RV64</option><option value="32">RV32</option></select>
      <span>I 基础指令</span>
      <label><input type="checkbox" id="codec-m" checked> M</label>
      <label><input type="checkbox" id="codec-a"> A（原子访存）</label>
      <label><input type="checkbox" id="codec-v"> V（向量）</label>
      <label><input type="checkbox" id="codec-f"> F（单精度）</label>
      <label><input type="checkbox" id="codec-d"> D（含 F）</label>
      <label><input type="checkbox" id="codec-csr" checked> Zicsr</label>
      <label><input type="checkbox" id="codec-fence" checked> Zifencei</label>
    </div>
    <form id="codec-asm-form" class="codec-form">
      <label for="codec-asm">汇编文本</label>
      <input id="codec-asm" class="codec-input" value="add x1, x2, x3" maxlength="256" spellcheck="false" aria-describedby="codec-error">
      <button type="submit" class="codec-button">汇编</button>
    </form>
    <form id="codec-word-form" class="codec-form">
      <label for="codec-word">机器码</label>
      <input id="codec-word" class="codec-input" value="0x003100b3" maxlength="66" spellcheck="false" aria-describedby="codec-error">
      <button type="submit" class="codec-button">反汇编</button>
    </form>
    <p id="instruction-transfer-status" class="desc" role="status"></p>
    <div id="codec-error" class="codec-error" role="status"></div>
    <div id="codec-result">
      <p id="codec-summary" class="codec-summary"></p>
      <p id="codec-bytes" class="desc"></p>
      <div id="codec-format-heading" class="heading" aria-live="polite" hidden></div>
      <div id="codec-diagram" class="scroll"></div>
    </div>
    <section id="format-reference" aria-label="当前指令语义" hidden>
    <div id="formats"></div>
    </section>
  </section>
  <noscript>请启用 JavaScript 以显示指令位域图与字段说明。</noscript>
</main>
<script src="riscv-codec.js"></script>
<script>
const opcode = ['opcode', 6, 0, 'opcode', '7 位主操作码，用于区分指令大类。'];
const rd = ['rd', 11, 7, 'destination', '目标整数寄存器编号，5 位编码对应 x0–x31。'];
const rs1 = ['rs1', 19, 15, 'source', '第一源整数寄存器编号；加载 / 存储时通常为基址寄存器。'];
const rs2 = ['rs2', 24, 20, 'source', '第二源整数寄存器编号；存储时提供待写入的数据。'];
const funct3 = ['funct3', 14, 12, 'function', '3 位功能码，与 opcode 等字段共同确定操作。'];
const FORMATS = [
  {
    id:'R', kind:'寄存器运算', instructions:'ADD / SUB / AND / OR / SLL',
    desc:'使用两个源寄存器，将结果写入 rd。典型形式：op rd, rs1, rs2。',
    fields:[['funct7',31,25,'function','7 位功能码。例如 ADD 为 0000000，SUB 为 0100000。'],rs2,rs1,funct3,rd,opcode],
    formula:[['code','ADD: x[rd] = (x[rs1] + x[rs2]) mod 2^XLEN\nSUB: x[rd] = (x[rs1] - x[rs2]) mod 2^XLEN\nAND: x[rd] = x[rs1] & x[rs2]\nOR:  x[rd] = x[rs1] | x[rs2]\nSLL: x[rd] = (x[rs1] << (x[rs2] & (XLEN - 1))) mod 2^XLEN']],
    note:'opcode / funct3 / funct7 共同选择具体操作；mod 2^XLEN 表示取模，结果范围为 0…2^XLEN−1，即只保留低 XLEN 位（负数也按此范围回绕）。所有写回均遵循 x[0] 恒为 0。',
    example:'add x1, x2, x3', word:0x003100b3,
    values:['0000000','00011','00010','000','00001','0110011']
  },
  {
    id:'I', kind:'立即数运算 / 加载 / JALR', instructions:'ADDI / ANDI / LW / JALR',
    desc:'一个源寄存器和一个连续的 12 位立即数，结果写入 rd。典型形式：op rd, rs1, imm。',
    fields:[['imm[11:0]',31,20,'immediate','12 位立即数，普通算术、加载和 JALR 使用符号扩展。'],rs1,funct3,rd,opcode],
    formula:[['code','imm = 符号扩展到XLEN位(inst[31:20])\nADDI: x[rd] = (x[rs1] + imm) mod 2^XLEN\nANDI: x[rd] = x[rs1] & imm\nLW:   x[rd] = 符号扩展到XLEN位(load32((x[rs1] + imm) mod 2^XLEN))\nJALR:\n  target = ((x[rs1] + imm) mod 2^XLEN) & ~1\n  link = (PC + 4) mod 2^XLEN\n  check_instruction_alignment(target)\n  x[rd] = link\n  PC = target']],
    note:'符号扩展到XLEN位 按源位宽符号扩展到 XLEN；普通 imm 范围 −2048…2047。JALR 先读取源寄存器再写回，适用于 rd=rs1。移位立即数和 CSR 复用布局，但分别编码 shamt/功能位和 CSR 地址。',
    example:'addi x1, x2, -1', word:0xfff10093,
    values:['111111111111','00010','000','00001','0010011']
  },
  {
    id:'S', kind:'存储', instructions:'SB / SH / SW / SD（RV64）',
    desc:'将 rs2 的数据写入 rs1 + 偏移指定的内存位置，不包含 rd。立即数被拆成高 7 位与低 5 位。',
    fields:[['imm[11:5]',31,25,'immediate','存储偏移的高 7 位，inst[31] 为符号位。'],rs2,rs1,funct3,['imm[4:0]',11,7,'immediate','存储偏移的低 5 位，占用 R / I 格式中 rd 的位置。'],opcode],
    formula:[['code','imm = 符号扩展到XLEN位(concat(inst[31:25], inst[11:7]))\naddr = (x[rs1] + imm) mod 2^XLEN\nSB: store8(addr, x[rs2][7:0])\nSH: store16(addr, x[rs2][15:0])\nSW: store32(addr, x[rs2][31:0])\nSD: store64(addr, x[rs2][63:0])  // RV64']],
    note:'concat 按从高到低拼接位段；偏移范围 −2048…2047 字节。load/store 表示架构内存访问，仍需地址翻译、权限及对齐检查，并非绕过异常的直接写内存。',
    example:'sw x3, 12(x2)', word:0x00312623,
    values:['0000000','00011','00010','010','01100','0100011']
  },
  {
    id:'B', kind:'条件分支', instructions:'BEQ / BNE / BLT / BGE / BLTU / BGEU',
    desc:'比较 rs1 与 rs2，条件成立时跳转到当前指令 PC + 偏移。立即数分散在四个区域，最低位隐含为 0。',
    fields:[['imm[12]',31,31,'immediate','分支偏移的符号位。'],['imm[10:5]',30,25,'immediate','偏移的第 10 到 5 位。'],rs2,rs1,funct3,['imm[4:1]',11,8,'immediate','偏移的第 4 到 1 位。'],['imm[11]',7,7,'immediate','偏移的第 11 位，注意它不与 imm[12] 相邻。'],opcode],
    formula:[['code','offset = 符号扩展到XLEN位(concat(inst[31], inst[7], inst[30:25], inst[11:8], 0b0))\nBEQ: taken = (x[rs1] == x[rs2])\nBNE: taken = (x[rs1] != x[rs2])\nBLT: taken = (signed(x[rs1]) < signed(x[rs2]))\nBGE: taken = (signed(x[rs1]) >= signed(x[rs2]))\nBLTU: taken = (unsigned(x[rs1]) < unsigned(x[rs2]))\nBGEU: taken = (unsigned(x[rs1]) >= unsigned(x[rs2]))\nif taken:\n  target = (PC + offset) mod 2^XLEN\n  check_instruction_alignment(target)\n  PC = target\nelse:\n  PC = (PC + 4) mod 2^XLEN']],
    note:'13 位有符号字节偏移，范围 −4096 … +4094，步长 2 字节。目标基于当前 PC，而非 PC + 4。仅支持 IALIGN=32 时，实际跳转目标仍须 4 字节对齐。',
    example:'beq x1, x2, +16', word:0x00208863,
    values:['0','000000','00010','00001','000','1000','0','1100011']
  },
  {
    id:'U', kind:'高位立即数', instructions:'LUI / AUIPC',
    desc:'指令高 20 位携带立即数，构造结果时低 12 位补 0。只包含 rd，无源寄存器字段。',
    fields:[['imm[31:12]',31,12,'immediate','立即数高 20 位，低 12 位不编码、固定补 0。'],rd,opcode],
    formula:[['code','imm32 = concat(inst[31:12], 0b000000000000)\nimm = 符号扩展到XLEN位(imm32)\nLUI:   x[rd] = imm\nAUIPC: x[rd] = (PC + imm) mod 2^XLEN\n\n// lui rd, 0x12345\nimm32 = 0x12345 << 12  // 0x12345000']],
    note:'concat 按从高到低拼接；符号扩展到XLEN位 将 32 位值符号扩展到 XLEN（RV32 不扩展）。PC 指当前指令地址；写 x[0] 的结果被丢弃。',
    example:'lui x1, 0x12345', word:0x123450b7,
    values:['00010010001101000101','00001','0110111']
  },
  {
    id:'J', kind:'无条件跳转', instructions:'JAL',
    desc:'跳转到当前 PC + 偏移，并将返回地址 PC + 4 写入 rd。立即数分散排列，最低位隐含为 0。',
    fields:[['imm[20]',31,31,'immediate','跳转偏移的符号位。'],['imm[10:1]',30,21,'immediate','偏移的第 10 到 1 位。'],['imm[11]',20,20,'immediate','偏移的第 11 位。'],['imm[19:12]',19,12,'immediate','偏移的第 19 到 12 位。'],rd,opcode],
    formula:[['code','offset = 符号扩展到XLEN位(concat(inst[31], inst[19:12], inst[20], inst[30:21], 0b0))\ntarget = (PC + offset) mod 2^XLEN\nlink = (PC + 4) mod 2^XLEN\ncheck_instruction_alignment(target)\nx[rd] = link\nPC = target']],
    note:'21 位有符号字节偏移，范围 −1048576 … +1048574，步长 2 字节。rd = x0 时丢弃返回地址（伪指令 j）。JALR 属于 I-type，不属于 J-type；IALIGN=32 时目标须 4 字节对齐。',
    example:'jal x1, +32', word:0x020000ef,
    values:['0','0000010000','0','00000000','00001','1101111']
  }
];

for (const [id, kind, assembly, note] of [
  ['V-OP', '向量整数运算 · OP-V', 'vadd.vv v1, v2, v3', 'funct3 区分 vv / vx / vi 等操作数类型；同一位置可能是向量寄存器、整数寄存器或立即数。vm=0 使用 v0.t 掩码。'],
  ['V-SETVL', '寄存器配置 · vsetvl', 'vsetvl x1, x2, x3', 'rs1 提供 AVL，rs2 提供 vtype；rd 接收选定的 VL。rs1/rd 为 x0 时有特殊规则。'],
  ['V-SETVLI', '立即数配置 · vsetvli', 'vsetvli zero, zero, e64, m4, tu, ma', 'vtypei 编码 LMUL、SEW 和尾部/掩码策略；不支持的配置可导致 vill 置位，不表示指令编码无法识别。'],
  ['V-SETIVLI', '立即 AVL 配置 · vsetivli', 'vsetivli zero, 19, e64, m4, tu, ma', 'AVL 来自 5 位 uimm，不是 rs1 寄存器；高两位固定为 11。'],
  ['V-MEM', '单位步长访存 · STORE-FP', 'vse32.v v16, (x25)', '示例对应故障机器码 0x020ce827。vs3 是存储源，不是 rd；width=110 表示 EEW=32，sumop=00000 为普通单位步长存储。向量加载使用 LOAD-FP opcode。'],
  ['V-STRIDE', '步长访存', 'vlse32.v v8, (x10), x11', 'mop=10，rs2 指定以字节为单位的步长，不是存储数据源。'],
  ['V-INDEX', '索引访存', 'vluxei32.v v8, (x10), v12', 'mop=01 为无序索引，11 为有序索引；width 表示索引 EEW，实际数据元素宽度取自 SEW。']
]) {
  const decoded = RISCVCodec.assemble(assembly, { xlen:64, extensions:['V'] });
  FORMATS.push({
    id, group:'V', kind, instructions:decoded.mnemonic, desc:'V 扩展 32 位编码子格式；下面展示代表指令的固定编码及可变操作数字段。',
    fields:decoded.fields.map(field => [field.name, field.hi, field.lo, field.category,
      field.description + (field.fixed ? '；本示例固定编码 0b' + field.fixedValue.toString(2).padStart(field.hi - field.lo + 1, '0') : '；可变字段'), field.fixed ? field.fixedValue.toString(16) : null]),
    formula:[['text','V 指令需结合 VL、VTYPE、VSTART 与掩码判断运行行为；编码解读不代表执行条件全部满足。']],
    note, example:assembly, word:decoded.word,
    values:decoded.fields.map(field => field.value.toString(2).padStart(field.hi - field.lo + 1, '0'))
  });
}

const container = document.getElementById('formats');
let activeFormat = null;
let activeDecoded = null;
function prioritizeFormat(decoded) {
  activeDecoded = decoded;
  activeFormat = null;
  if (decoded) {
    if (decoded.format === 'V') {
      activeFormat = ({ vsetvl:'V-SETVL', vsetvli:'V-SETVLI', vsetivli:'V-SETIVLI' })[decoded.mnemonic];
      if (!activeFormat) {
        const opcode = Number(decoded.word & 127n);
        const mop = Number((decoded.word >> 26n) & 3n);
        activeFormat = opcode === 0x57 ? 'V-OP' : mop === 2 ? 'V-STRIDE' : mop === 1 || mop === 3 ? 'V-INDEX' : 'V-MEM';
      }
    } else activeFormat = decoded.format;
  }
  const heading = document.getElementById('codec-format-heading');
  heading.replaceChildren();
  heading.hidden = !decoded;
  if (decoded) {
    const reference = FORMATS.find(format => format.id === activeFormat);
    let kind = reference?.kind || (decoded.format === 'R4' ? '融合乘加' : decoded.format === 'AMO' ? '原子访存' : '指令编码');
    if (decoded.format === 'R' && ['F','D'].includes(decoded.extension)) kind = '浮点运算 / 转换';
    if (decoded.extension === 'Zicsr') kind = 'CSR 访问';
    heading.append(element('strong', '', decoded.format + '-type'), element('span', 'tag', kind));
  }
  render();
}
function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
function instructionSemantics(decoded) {
  const name = decoded.mnemonic;
  const imm = 'imm = 符号扩展到XLEN位(inst[31:20])\n';
  const wrap = expression => '(' + expression + ') mod 2^XLEN';
  const binary = { add:'+', sub:'-', and:'&', or:'|', xor:'^' };
  if (binary[name]) return 'x[rd] = ' + (['add','sub'].includes(name) ? wrap('x[rs1] ' + binary[name] + ' x[rs2]') : 'x[rs1] ' + binary[name] + ' x[rs2]');
  const immediate = { addi:'+', andi:'&', ori:'|', xori:'^' };
  if (immediate[name]) return imm + 'x[rd] = ' + (name === 'addi' ? wrap('x[rs1] + imm') : 'x[rs1] ' + immediate[name] + ' imm');
  if (['slt','sltu','slti','sltiu'].includes(name)) {
    const isImmediate = name.includes('i'), cast = name.endsWith('u') ? 'unsigned' : 'signed';
    return (isImmediate ? imm : '') + 'x[rd] = (' + cast + '(x[rs1]) < ' + cast + '(' + (isImmediate ? 'imm' : 'x[rs2]') + ')) ? 1 : 0';
  }
  if (['addw','subw','addiw'].includes(name)) return (name === 'addiw' ? imm : '') + 'result32 = (x[rs1] ' + (name === 'subw' ? '-' : '+') + ' ' + (name === 'addiw' ? 'imm' : 'x[rs2]') + ') mod 2^32\nx[rd] = 符号扩展到XLEN位(result32)';
  if (/^s(ll|rl|ra)i?w?$/.test(name)) {
    const word = name.endsWith('w'), immediate = name.includes('i'), arithmetic = name.startsWith('sra');
    const bits = word ? '32' : 'XLEN';
    const source = word ? 'x[rs1][31:0]' : 'x[rs1]';
    return 'shamt = ' + (immediate ? 'inst[' + (word || decoded.xlen === 32 ? '24' : '25') + ':20]' : 'x[rs2] & (' + bits + ' - 1)') + '\nresult = (' + (arithmetic ? 'signed(' + source + ')' : source) + (name.startsWith('sll') ? ' << shamt' : arithmetic ? ' arithmetic_shift_right shamt' : ' logical_shift_right shamt') + ') mod 2^' + bits + '\nx[rd] = ' + (word ? '符号扩展到XLEN位(result)' : 'result');
  }
  const loads = { lb:8, lbu:8, lh:16, lhu:16, lw:32, lwu:32, ld:64, flw:32, fld:64 };
  if (loads[name]) {
    const floating = name.startsWith('f');
    return imm + 'addr = ' + wrap('x[rs1] + imm') + '\n' + (floating ? 'f[rd]' : 'x[rd]') + ' = ' + (floating ? (name === 'flw' ? 'NaN_box_FLEN' : 'load64') : name.endsWith('u') ? '零扩展到XLEN位' : '符号扩展到XLEN位') + (floating && name === 'fld' ? '(addr)' : '(load' + loads[name] + '(addr))');
  }
  const stores = { sb:8, sh:16, sw:32, sd:64, fsw:32, fsd:64 };
  if (stores[name]) return 'imm = 符号扩展到XLEN位(concat(inst[31:25], inst[11:7]))\naddr = ' + wrap('x[rs1] + imm') + '\nstore' + stores[name] + '(addr, ' + (name.startsWith('f') ? 'f' : 'x') + '[rs2][' + (stores[name] - 1) + ':0])';
  if (['lui','auipc'].includes(name)) return 'imm32 = concat(inst[31:12], 0b000000000000)\nimm = 符号扩展到XLEN位(imm32)\nx[rd] = ' + (name === 'lui' ? 'imm' : wrap('PC + imm'));
  const branches = { beq:'x[rs1] == x[rs2]', bne:'x[rs1] != x[rs2]', blt:'signed(x[rs1]) < signed(x[rs2])', bge:'signed(x[rs1]) >= signed(x[rs2])', bltu:'unsigned(x[rs1]) < unsigned(x[rs2])', bgeu:'unsigned(x[rs1]) >= unsigned(x[rs2])' };
  if (branches[name]) return 'offset = 符号扩展到XLEN位(concat(inst[31], inst[7], inst[30:25], inst[11:8], 0b0))\nif ' + branches[name] + ':\n    target = ' + wrap('PC + offset') + '\n    check_instruction_alignment(target)\n    PC = target\nelse:\n    PC = ' + wrap('PC + 4');
  if (name === 'jal' || name === 'jalr') return (name === 'jal' ? 'offset = 符号扩展到XLEN位(concat(inst[31], inst[19:12], inst[20], inst[30:21], 0b0))\ntarget = ' + wrap('PC + offset') : imm + 'target = (' + wrap('x[rs1] + imm') + ') & ~1') + '\nlink = ' + wrap('PC + 4') + '\ncheck_instruction_alignment(target)\nx[rd] = link\nPC = target';
  if (name === 'mul' || name === 'mulw') return name === 'mul' ? 'x[rd] = (x[rs1] * x[rs2]) mod 2^XLEN' : 'result32 = (x[rs1] * x[rs2]) mod 2^32\nx[rd] = 符号扩展到XLEN位(result32)';
  if (['mulh','mulhu','mulhsu'].includes(name)) return 'product = ' + (name === 'mulhu' ? 'unsigned' : 'signed') + '(x[rs1]) * ' + (name === 'mulh' ? 'signed' : 'unsigned') + '(x[rs2])\nx[rd] = (product mod 2^(2 * XLEN))[2 * XLEN - 1:XLEN]';
  if (name === 'ecall') return 'raise_exception(environment_call, current_privilege)\nexception_pc = PC';
  if (name === 'ebreak') return 'raise_exception(breakpoint)\nexception_pc = PC';
  const memory = /^(vl|vs)e(8|16|32|64)\.v$/.exec(name);
  if (memory) {
    const bits = Number(memory[2]), store = memory[1] === 'vs';
    return 'for i in VSTART .. VL - 1:\n    if vm == 1 or v0.mask[i] == 1:\n        addr = (x[rs1] + i * ' + (bits / 8) + ') mod 2^XLEN\n        ' + (store ? 'store' + bits + '(addr, v[vs3].element' + bits + '[i])' : 'v[vd].element' + bits + '[i] = load' + bits + '(addr)') + '\n// 正常完成后 VSTART = 0；掩码/尾部策略按 VTYPE，异常按向量重启规则处理';
  }
  const vector = /^(vadd|vsub|vand|vor|vxor)\.(vv|vx|vi)$/.exec(name);
  if (vector) {
    const op = { vadd:'+', vsub:'-', vand:'&', vor:'|', vxor:'^' }[vector[1]];
    const operand = vector[2] === 'vv' ? 'v[vs1].element_SEW[i]' : vector[2] === 'vx' ? 'resize_signed_to_SEW(x[rs1])' : '符号扩展到SEW位(inst[19:15])';
    return 'for i in VSTART .. VL - 1:\n    if vm == 1 or v0.mask[i] == 1:\n        v[vd].element_SEW[i] = (v[vs2].element_SEW[i] ' + op + ' ' + operand + ') mod 2^SEW\n// 正常完成后 VSTART = 0；未激活元素和尾部按 VTYPE 策略处理';
  }
  return '';
}

function render() {
  container.replaceChildren();
  document.getElementById('format-reference').hidden = !activeDecoded;
  if (!activeDecoded) return;
  const card = element('section', 'card');
  card.id = activeFormat + '-type';
  card.dataset.mnemonic = activeDecoded.mnemonic;
  card.append(element('h2', '', activeDecoded.mnemonic + ' · 语义'));
  const code = instructionSemantics(activeDecoded);
  if (code) {
    const block = element('pre', 'operation-code');
    block.append(element('code', '', code));
    card.append(block);
  }
  else card.append(element('p', 'desc', '当前仅提供 ' + activeDecoded.mnemonic + ' 的编码解析，尚未提供该指令的独立语义伪代码。'));
  if (code) card.append(element('p', 'desc', '伪代码描述成功执行路径，不模拟执行。mod 2^N 取低 N 位，符号扩展在高位补原值的最高位，零扩展在高位补 0；x[0] 恒为零。访存仍需翻译、权限及对齐检查。'));
  if (activeDecoded.note) card.append(element('p', 'desc', activeDecoded.note));
  container.append(card);
}
render();
</script>
<script src="page-state.js"></script>
<script>
const codecAsm = document.getElementById('codec-asm');
const codecWordInput = document.getElementById('codec-word');
const codecError = document.getElementById('codec-error');
const codecResult = document.getElementById('codec-result');
let codecWord = 0x003100b3n;
let codecSource = 'assembly';
function codecOptions() {
  const extensions = ['I'];
  for (const [id, name] of [['codec-m','M'], ['codec-a','A'], ['codec-v','V'], ['codec-f','F'], ['codec-d','D'], ['codec-csr','Zicsr'], ['codec-fence','Zifencei']]) {
    if (document.getElementById(id).checked) extensions.push(name);
  }
  return { xlen:Number(document.getElementById('codec-xlen').value), extensions };
}
function codecHex(value) { return '0x' + value.toString(16).padStart(8, '0'); }
function renderCodecWord(decoded) {
  prioritizeFormat(decoded);
  codecResult.hidden = false;
  document.getElementById('codec-summary').textContent = decoded
    ? decoded.assembly + ' · ' + decoded.extension + ' · ' + decoded.format + '-type · 匹配掩码=' + codecHex(decoded.mask) + ' / 固定值=' + codecHex(decoded.match)
    : '当前机器码未被所选架构 / 扩展的编解码器识别。下方仅显示原始位段，不代表已判定指令类型或架构非法。';
  const bytes = Array.from({length:4}, (_, i) => ((codecWord >> BigInt(i * 8)) & 255n).toString(16).padStart(2, '0'));
  document.getElementById('codec-bytes').textContent = codecHex(codecWord) + ' · 小端字节（低地址 → 高地址）：' + bytes.join(' ');
  const diagram = document.getElementById('codec-diagram');
  diagram.replaceChildren();
  const labels = element('div', 'bit-labels');
  labels.setAttribute('aria-hidden', 'true');
  const bits = element('div', 'codec-bits');
  const pattern = element('div', 'codec-pattern');
  pattern.setAttribute('aria-label', '当前指令编码模板：0/1 为固定编码，· 为可变位，? 为未识别');
  const fields = decoded ? decoded.fields : [[31,25],[24,20],[19,15],[14,12],[11,7],[6,0]].map(([hi,lo]) => ({name:'bits['+hi+':'+lo+']', hi, lo, value:(codecWord >> BigInt(lo)) & ((1n << BigInt(hi-lo+1))-1n), category:'function', description:'原始位段；尚未识别指令。'}));
  for (let bit = 31; bit >= 0; bit--) {
    labels.append(element('span', '', bit));
    const value = (codecWord >> BigInt(bit)) & 1n;
    const button = element('button', 'codec-bit', value.toString());
    button.type = 'button'; button.id = 'codec-bit-' + bit;
    button.setAttribute('aria-pressed', String(value === 1n));
    const fixed = decoded ? ((decoded.mask >> BigInt(bit)) & 1n) === 1n : false;
    const expected = decoded ? (decoded.match >> BigInt(bit)) & 1n : null;
    const patternBit = element('span', '', decoded ? fixed ? String(expected) : '·' : '?');
    patternBit.dataset.fixed = String(fixed);
    patternBit.title = '第 ' + bit + ' 位：' + (decoded ? fixed ? '固定编码 ' + expected : '可变位' : '尚未识别，不推断固定值');
    pattern.append(patternBit);
    button.dataset.fixed = String(fixed);
    const fixedText = fixed ? '；当前指令固定为 ' + expected + '，修改可能改变指令或成为未识别编码' : '';
    button.setAttribute('aria-label', '第 ' + bit + ' 位 = ' + value + fixedText + '，点击翻转');
    const bf = fields.find(f => bit >= f.lo && bit <= f.hi);
    button.title = bf
      ? '第 ' + bit + ' 位 · ' + bf.name + '：' + bf.description + fixedText
      : '第 ' + bit + ' 位 · 保留 / 未定义位';
    button.addEventListener('click', () => {
      codecSource = 'word'; codecWord ^= 1n << BigInt(bit);
      codecWordInput.value = codecHex(codecWord); updateCodec('word');
      document.getElementById('codec-bit-' + bit).focus();
    });
    bits.append(button);
  }
  const row = element('div', 'bit-row');
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = '600 13px ui-monospace,monospace';
  fields.forEach(field => {
    const width = field.hi - field.lo + 1;
    const narrow = measure.measureText(field.name).width > width * 32 - 10;
    const box = element('div', 'field ' + field.category + (narrow ? ' narrow' : ''));
    box.style.gridColumn = 'span ' + width;
    box.dataset.fixed = String(field.fixed === true);
    box.dataset.field = field.name;
    const fixedDescription = field.fixed ? '固定编码 = 0b' + field.fixedValue.toString(2).padStart(width, '0') : field.fixedMask ? '部分固定，掩码 0x' + field.fixedMask.toString(16) + '，固定值 0x' + field.fixedValue.toString(16) : '';
    box.append(element('span', 'field-name', field.name), element('span', 'codec-field-value', '0x' + field.value.toString(16)));
    if (fixedDescription) box.append(element('span', 'fixed-marker', field.fixed ? '固定 0x' + field.fixedValue.toString(16) : '部分固定'));
    box.tabIndex = 0;
    box.title = field.name + ' [' + (field.hi === field.lo ? field.hi : field.hi + ':' + field.lo) + ']：' + field.description + (fixedDescription ? '；' + fixedDescription : '');
    box.setAttribute('aria-label', field.name + '，值 ' + field.value + '。' + field.description + '。' + fixedDescription);
    box.addEventListener('mouseenter', () => box.classList.add('active'));
    box.addEventListener('mouseleave', () => box.classList.remove('active'));
    box.addEventListener('focus', () => box.classList.add('active'));
    box.addEventListener('blur', () => box.classList.remove('active'));
    row.append(box);
  });
  diagram.append(labels, pattern, bits, row);
}
function updateCodec(source) {
  codecSource = source;
  codecError.textContent = '';
  codecAsm.setAttribute('aria-invalid', 'false'); codecWordInput.setAttribute('aria-invalid', 'false');
  const options = codecOptions();
  if (source === 'assembly') {
    try {
      const decoded = RISCVCodec.assemble(codecAsm.value, options);
      codecWord = decoded.word; codecWordInput.value = codecHex(codecWord);
      renderCodecWord(decoded);
    } catch (error) {
      codecError.textContent = error.message; codecAsm.setAttribute('aria-invalid', 'true');
      codecWordInput.value = ''; codecResult.hidden = true;
      prioritizeFormat(null);
    }
  } else {
    try { codecWord = RISCVCodec.parseWord(codecWordInput.value); }
    catch (error) {
      codecError.textContent = error.message; codecWordInput.setAttribute('aria-invalid', 'true');
      codecAsm.value = ''; codecResult.hidden = true; prioritizeFormat(null); return;
    }
    try {
      const decoded = RISCVCodec.decode(codecWord, options);
      codecAsm.value = decoded.assembly; renderCodecWord(decoded);
    } catch (error) {
      codecAsm.value = ''; codecError.textContent = error.message;
      renderCodecWord(null);
    }
  }
}
function updateCodecOptions() {
  updateCodec(codecSource);
}
document.getElementById('codec-asm-form').addEventListener('submit', event => { event.preventDefault(); updateCodec('assembly'); });
document.getElementById('codec-word-form').addEventListener('submit', event => { event.preventDefault(); updateCodec('word'); });
codecAsm.addEventListener('input', () => updateCodec('assembly'));
codecWordInput.addEventListener('input', () => updateCodec('word'));
for (const id of ['codec-xlen','codec-m','codec-a','codec-v','codec-f','codec-d','codec-csr','codec-fence']) document.getElementById(id).addEventListener('change', updateCodecOptions);
updateCodecOptions();
const saveCodecState = PageState.bind({ read:() => ({ source:codecSource }), restore:extra => { codecSource = extra?.source === 'word' ? 'word' : 'assembly'; }, render:() => { render(); updateCodecOptions(); } });
{
  try {
    const raw = sessionStorage.getItem('riscv-trap-instruction');
    if (raw !== null) {
      if (raw.length > 200) throw new Error('指令数据过长');
      const incoming = JSON.parse(raw);
      if (!incoming || incoming.version !== 1 || ![32,64].includes(incoming.xlen) || typeof incoming.word !== 'string') throw new Error('指令数据格式无效');
      const word = RISCVCodec.parseWord(incoming.word);
      document.getElementById('codec-xlen').value = String(incoming.xlen);
      codecWordInput.value = codecHex(word);
      updateCodec('word');
      sessionStorage.removeItem('riscv-trap-instruction');
      saveCodecState();
      document.getElementById('instruction-transfer-status').textContent = '已载入异常页机器码与 XLEN。扩展选项沿用本页设置；未识别的指令仍显示原始位段，不代表指令非法。';
      codecWordInput.scrollIntoView({ block:'center' });
      codecWordInput.focus({ preventScroll:true });
    }
  } catch (error) {
    document.getElementById('instruction-transfer-status').textContent = '未载入指令：' + error.message;
  }
}
