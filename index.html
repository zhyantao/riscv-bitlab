<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>字节转换工具</title>
    <style>
      :root {
        --card-bg: #fff;
        --border: #e2e2e2;
        --accent: #4caf50;
        --danger: #c62828;
        --text: #333;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        max-width: 860px;
        margin: 0 auto;
        padding: 20px;
        background: #f0f2f5;
        color: var(--text);
      }
      .control-panel {
        background: var(--card-bg);
        padding: 20px 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .section { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid #eee; }
      .section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
      h2 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
      .step-badge {
        background: var(--accent);
        color: #fff;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        flex-shrink: 0;
      }
      .input-row { display: flex; align-items: end; gap: 12px; }
      .input-field { flex: 1; min-width: 0; }
      label { display: block; font-size: 13px; margin-bottom: 6px; }
      input {
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        font-size: 14px;
        min-height: 42px;
      }
      input { width: 100%; font-family: "SF Mono", Menlo, monospace; }
      :focus-visible { outline: 2px solid #287d2c; outline-offset: 3px; }
      .tip { font-size: 12px; color: #666; margin: 8px 0 0; line-height: 1.7; }
      .error { color: var(--danger); font-size: 13px; margin: 8px 0 0; }
      button {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 12px;
        background: #fafafa;
        color: var(--text);
        cursor: pointer;
        font-size: 12px;
      }
      button:hover { background: #edf7ee; border-color: var(--accent); }
      #clear-btn { min-height: 42px; flex-shrink: 0; color: var(--danger); }
      .bit-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 12px; }
      .bit-byte { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; }
      .bit-cell { min-width: 0; text-align: center; }
      .bit-index { display: block; margin-bottom: 5px; font-size: 10px; color: #777; }
      .bit-button { width: 100%; padding: 9px 0; border-radius: 4px; font-family: "SF Mono", Menlo, monospace; font-size: 14px; }
      .bit-button[aria-pressed="true"] { background: #287d2c; border-color: #287d2c; color: #fff; }
      .bit-button:disabled { cursor: not-allowed; opacity: 0.5; }
      table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
      th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
      th { background: #f6f8fa; font-weight: 600; line-height: 1.6; }
      th:first-child { width: 15%; }
      td { font-family: "SF Mono", Menlo, "Courier New", monospace; overflow-wrap: anywhere; line-height: 1.7; }
      td:first-child { font-family: inherit; color: #666; }
      tbody tr:last-child td { border-bottom: none; }
      .unit { display: block; color: #287d2c; font-size: 12px; }
      @media (max-width: 540px) {
        body { padding: 12px; }
        .control-panel { padding: 16px 12px; }
        .bit-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        th, td { padding: 10px 6px; }
        th:first-child { width: 18%; }
      }
    </style>
  </head>
  <body>
    <main class="control-panel">
      <section class="section" aria-labelledby="binary-title">
        <h2 id="binary-title">64 bit 二进制表示</h2>
        <div id="bit-grid" class="bit-grid" role="group" aria-labelledby="binary-title" aria-describedby="bit-tip"></div>
        <p class="tip" id="bit-tip"></p>
      </section>

      <section class="section">
        <h2><span class="step-badge">1</span> 输入数字</h2>
        <div class="input-row">
          <div class="input-field">
            <input id="number-input" type="text" aria-label="字节数" value="0x40000000" placeholder="例如 0x40000000 或 1073741824"
              autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="4096"
              aria-describedby="input-tip input-error" aria-invalid="false" />
          </div>
          <button type="button" id="clear-btn">清空</button>
        </div>
        <p class="tip" id="input-tip">自动识别：0x 前缀或含 A–F 的整数按十六进制，纯数字按十进制。纯数字十六进制请加 0x。仅接受非负整数，最多 4096 个字符。</p>
        <p class="error" id="input-error" role="alert" hidden></p>
      </section>

      <section class="section">
        <h2><span class="step-badge">2</span> 单位换算</h2>
        <table aria-label="字节单位换算结果">
          <thead>
            <tr><th scope="col">量级</th><th scope="col">十进制单位<br />每级 1000 字节倍数</th><th scope="col">二进制单位<br />每级 1024 字节倍数</th></tr>
          </thead>
          <tbody id="results"></tbody>
        </table>
        <p class="tip">1 B = 1 字节；1 MB = 1,000,000 B，1 MiB = 1,048,576 B。内存容量常用 1024 进制，标准单位为 KiB / MiB / GiB / TiB。</p>
        <p class="tip">使用 BigInt 精确计算，完整显示有限小数，不进行浮点近似或四舍五入。</p>
      </section>
    </main>

    <script>
      const input = document.getElementById("number-input");
      const error = document.getElementById("input-error");
      const bitGrid = document.getElementById("bit-grid");
      const bitTip = document.getElementById("bit-tip");
      let currentBytes = 0n;
      const bitButtons = [];
      for (let byte = 7; byte >= 0; byte--) {
        const group = document.createElement("div");
        group.className = "bit-byte";
        for (let offset = 7; offset >= 0; offset--) {
          const bit = byte * 8 + offset;
          const cell = document.createElement("div");
          cell.className = "bit-cell";
          const index = document.createElement("span");
          index.className = "bit-index";
          index.textContent = bit.toString();
          const button = document.createElement("button");
          button.type = "button";
          button.className = "bit-button";
          button.addEventListener("click", () => {
            if (currentBytes === null) return;
            const value = currentBytes ^ (1n << BigInt(bit));
            const hexadecimal = /^0x/i.test(input.value.trim()) || /[a-f]/i.test(input.value);
            input.value = hexadecimal ? "0x" + value.toString(16).toUpperCase() : value.toString();
            updateResults();
          });
          bitButtons.push({ button, bit });
          cell.append(index, button);
          group.appendChild(cell);
        }
        bitGrid.appendChild(group);
      }
      const units = [
        ["字节", "B", "B"],
        ["千字节", "KB", "KiB"],
        ["兆字节", "MB", "MiB"],
        ["吉字节", "GB", "GiB"],
        ["太字节", "TB", "TiB"],
      ];
      const resultCells = units.map(([label, decimalUnit, binaryUnit]) => {
        const row = document.createElement("tr");
        const name = document.createElement("td");
        name.textContent = label;
        row.appendChild(name);
        const cells = [decimalUnit, binaryUnit].map((unit) => {
          const cell = document.createElement("td");
          const value = document.createElement("span");
          const suffix = document.createElement("span");
          suffix.className = "unit";
          suffix.textContent = unit;
          cell.append(value, suffix);
          row.appendChild(cell);
          return value;
        });
        document.getElementById("results").appendChild(row);
        return cells;
      });

      function parseBytes(raw) {
        const text = raw.trim();
        if (!text) return null;
        if (raw.length > 4096) throw new Error("输入不能超过 4096 个字符。");
        if (/^0x/i.test(text) || /[a-f]/i.test(text)) {
          if (!/^(?:0x)?[0-9a-f]+$/i.test(text)) {
            throw new Error("请输入有效的十六进制非负整数，例如 0xFF 或 FF。");
          }
          return BigInt("0x" + text.replace(/^0x/i, ""));
        }
        if (!/^[0-9]+$/.test(text)) {
          throw new Error("请输入有效的十进制非负整数，不支持小数、负数或分隔符。");
        }
        return BigInt(text);
      }

      function formatRatio(bytes, divisor) {
        const integer = bytes / divisor;
        let remainder = bytes % divisor;
        let fraction = "";
        // 1000 和 1024 的幂仅包含因子 2、5，因此小数展开一定终止。
        while (remainder !== 0n) {
          remainder *= 10n;
          fraction += (remainder / divisor).toString();
          remainder %= divisor;
        }
        return integer.toString() + (fraction ? "." + fraction : "");
      }

      function updateResults() {
        let bytes = null;
        error.textContent = "";
        error.hidden = true;
        input.setAttribute("aria-invalid", "false");
        try {
          bytes = parseBytes(input.value);
        } catch (failure) {
          error.textContent = failure.message;
          error.hidden = false;
          input.setAttribute("aria-invalid", "true");
        }
        currentBytes = error.hidden ? (bytes ?? 0n) : null;
        bitButtons.forEach(({ button, bit }) => {
          const enabled = currentBytes !== null;
          const isSet = enabled && (currentBytes & (1n << BigInt(bit))) !== 0n;
          button.disabled = !enabled;
          button.textContent = enabled ? (isSet ? "1" : "0") : "—";
          button.setAttribute("aria-pressed", String(isSet));
          button.setAttribute("aria-label", `bit ${bit}：${enabled ? (isSet ? "1" : "0") : "不可用"}，点击翻转`);
        });
        bitTip.hidden = currentBytes === null || currentBytes < (1n << 64n);
        bitTip.textContent = bitTip.hidden ? "" : "当前数值超过 64 位，仅显示低 64 位，翻转时保留高位。";
        resultCells.forEach((cells, index) => {
          cells.forEach((cell, column) => {
            const divisor = (column === 0 ? 1000n : 1024n) ** BigInt(index);
            cell.textContent = bytes === null ? "—" : formatRatio(bytes, divisor);
          });
        });
      }

      input.addEventListener("input", updateResults);
      document.getElementById("clear-btn").addEventListener("click", () => {
        input.value = "";
        updateResults();
        input.focus();
      });
      updateResults();
    </script>
  </body>
</html>
