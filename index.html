<!DOCTYPE html>

<style>

  main { max-width:1200px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:20px; }

  .desc { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .bits-wrap { overflow-x:auto; padding:4px 2px 8px; }
  .bit-labels, .row { display:grid; grid-template-columns:repeat(var(--bits),minmax(0,1fr)); min-width:calc(var(--bits) * 32px); }
  .bit-labels span { font:11px ui-monospace,monospace; text-align:center; color:var(--muted); padding:5px 0; }
  .row { margin-bottom:12px; }
  .cell { min-width:0; min-height:102px; padding:12px 4px; border:1px solid #9ca3af; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; position:relative; }

  .cell small { font-size:11px; color:#4b5563; }

  tr.hover { background:#eff6ff; }

  .tag { font-size:11px; padding:1px 6px; border-radius:10px; background:#e0e7ff; color:#3730a3; }
  .hidden { display:none; }
  .value-panel { background:#f8fafc; border:1px solid var(--line); border-radius:6px; padding:12px; margin:12px 0; }
  .value-controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .value-input, .field-input { font:14px ui-monospace,monospace; padding:7px 8px; border:1px solid #9ca3af; border-radius:4px; max-width:100%; }

  .binary-value { display:block; overflow-wrap:anywhere; font:12px/1.8 ui-monospace,monospace; margin-top:8px; }
  .bit-values { display:grid; grid-template-columns:repeat(var(--bits),minmax(0,1fr)); min-width:calc(var(--bits) * 32px); }

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function fieldsFor(reg, xlen) {
  const width = regTop(reg, xlen);
  const mode = reg.width === 'XLEN' ? xlen : width;
  return reg.fields.filter(f => f[4] === 'both' || f[4] === mode)
    .filter(f => f[2] < width)
    .map(f => [f[0], Math.min(f[1], width - 1), ...f.slice(2)])
    .sort((a,b) => b[1]-a[1]);
}

function regTop(reg, xlen) {
  if (reg.width === 'XLEN') return xlen;
  return parseInt(reg.width);
}

const registerValues = new Map();
function bitMask(width) { return (1n << BigInt(width)) - 1n; }
function readField(value, hi, lo) { return (value >> BigInt(lo)) & bitMask(hi - lo + 1); }
function writeField(value, hi, lo, next) {
  const mask = bitMask(hi - lo + 1) << BigInt(lo);
  return (value & ~mask) | ((next << BigInt(lo)) & mask);
}
function parseValue(text, width) {
  const input = text.trim();
  if (!/^(?:0x[0-9a-f]+|0b[01]+|[0-9]+)$/i.test(input)) {
    throw new Error('请输入 0x 十六进制、0b 二进制或无前缀十进制非负整数。');
  }
  if (input.length > 66) throw new Error('输入过长，最多支持 64 位数值。');
  const value = BigInt(input);
  if (value > bitMask(width)) throw new Error(`数值超出 ${width} 位范围（最大 0x${bitMask(width).toString(16)}）。`);
  return value;
}
function parseAssignment(text, xlen) {
  const match = /^\s*([a-z][a-z0-9]*)\s*=\s*(.*?)\s*$/i.exec(text);
  if (!match) throw new Error('请使用 寄存器名 = 数值 格式，例如 mstatus = 0x1800。');
  const reg = REGS.find(item => item.id === match[1].toLowerCase());
  if (!reg) throw new Error('暂不支持该寄存器名，请使用本页卡片名；别名寄存器不自动映射。');
  const width = regTop(reg, xlen);
  return { reg, width, value: parseValue(match[2], width) };
}
function fieldMeaning(reg, field, value, width) {
  const name = field[0];
  let choices;
  if (['FS','VS','XS'].includes(name)) choices = ['Off','Initial','Clean','Dirty'];
  if (name === 'MPP') choices = {0:'U 模式',1:'S 模式',2:'保留',3:'M 模式'};
  if (name === 'SPP') choices = ['U 模式','S 模式'];
  if (['MXL','SXL','UXL','VSXL'].includes(name)) choices = {1:'32 位',2:'64 位',3:'128 位 / 需核对实现'};
  if (reg.id === 'satp' && name === 'MODE') choices = width === 32 ? {0:'Bare',1:'Sv32'} : {0:'Bare',8:'Sv39',9:'Sv48',10:'Sv57'};
  if (reg.id === 'mtvec' && name === 'MODE') choices = ['Direct','Vectored'];
  if (reg.id === 'pmpcfg' && name === 'A') choices = ['OFF','TOR','NA4','NAPOT'];
  if (name === 'frm') choices = ['RNE','RTZ','RDN','RUP','RMM'];
  if (name === 'Interrupt') choices = ['异常','中断'];
  if (choices) return choices[value.toString()] ?? '保留 / 未定义编码';
  return '';
}

function render() {
  const xlen = parseInt(xlenSel.value);
  const keys = q.value.toLowerCase().split(/[\s/／,，、]+/u).filter(Boolean);
  const matches = text => keys.some(key => text.toLowerCase().includes(key));
  main.innerHTML = '';
  REGS.forEach(reg => {
    if (sel.value !== 'all' && sel.value !== reg.id) return;
    const fs = fieldsFor(reg, xlen);
    if (keys.length && !fs.some(f => matches(f[0])) && !matches(reg.name)) return;
    const top = regTop(reg, xlen) - 1;
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<h2>${esc(reg.name)} <span class="tag">${reg.priv}</span> <span class="tag">CSR ${esc(reg.addr)}</span></h2><div class="desc">${esc(reg.desc)}</div>`;
    const width = top + 1;
    const stateKey = `${reg.id}:${width}`;
    let value = registerValues.get(stateKey) ?? 0n;
    const bindings = [];
    const editors = new Map();
    const panel = document.createElement('div'); panel.className = 'value-panel';
    const controls = document.createElement('div'); controls.className = 'value-controls';
    const label = document.createElement('label'); label.textContent = `${width} 位原始值`;
    const input = document.createElement('input'); input.className = 'value-input';
    input.id = `${reg.id}-value`; input.type = 'text'; input.spellcheck = false;
    input.maxLength = 66; label.htmlFor = input.id;
    const reset = document.createElement('button'); reset.className = 'value-reset';
    reset.type = 'button'; reset.textContent = '清零';
    const error = document.createElement('div'); error.className = 'value-error';
    error.id = `${reg.id}-error`; error.setAttribute('aria-live', 'polite');
    input.setAttribute('aria-describedby', error.id);
    const binary = document.createElement('output'); binary.className = 'binary-value';
    const help = document.createElement('p'); help.className = 'value-help';
    help.textContent = '输入 0x 十六进制、0b 二进制或十进制，实时联动。点击位值翻转 0/1；点击多位字段定位下方编辑框。按寄存器卡片和位宽分别暂存，切换、筛选不会丢失，刷新页面清空。仅解析原始编码，不模拟只读、WARL、SD 派生规则或寄存器间别名关系；保留位也可通过原始值修改。组合标题共用一份布局演示值，fcsr 按完整 fcsr 布局解释。';
    controls.append(label, input, reset);
    panel.append(controls, error, binary, help);
    card.appendChild(panel);
    function refresh(origin) {
      registerValues.set(stateKey, value);
      if (origin !== input) input.value = '0x' + value.toString(16).padStart(Math.ceil(width / 4), '0');
      input.setAttribute('aria-invalid', 'false'); error.textContent = '';
      binary.textContent = '二进制：' + value.toString(2).padStart(width, '0').match(/.{1,4}/g).join(' ');
      bindings.forEach(update => update(origin));
    }
    input.addEventListener('input', () => {
      try { value = parseValue(input.value, width); refresh(input); }
      catch (e) { error.textContent = e.message; input.setAttribute('aria-invalid', 'true'); }
    });
    reset.addEventListener('click', () => { value = 0n; refresh(); });

    // 按位宽绘制，补齐空洞为未定义；超过 32 位时拆成 hi/lo 两行
    const cells = [];
    let cur = top;
    fs.forEach(f => {
      if (f[1] > cur) return;
      if (f[1] < cur) cells.push({gap:true, hi:cur, lo:f[1]+1});
      cells.push({f, hi:f[1], lo:f[2]});
      cur = f[2]-1;
    });
    if (cur >= 0) cells.push({gap:true, hi:cur, lo:0});

    const rows = top >= 32 ? [[63,32],[31,0]].filter(r => r[0] <= top || r[1] <= top).map(r => [Math.min(r[0],top), r[1]]) : [[top,0]];
    const wrap = document.createElement('div'); wrap.className = 'bits-wrap';
    const measure = document.createElement('canvas').getContext('2d');
    measure.font = '600 13px ui-monospace,monospace';
    rows.forEach(([rh, rl]) => {
      const labels = document.createElement('div'); labels.className = 'bit-labels';
      labels.style.setProperty('--bits', rh - rl + 1);
      labels.setAttribute('aria-hidden', 'true');
      const bitValues = document.createElement('div'); bitValues.className = 'bit-values';
      bitValues.style.setProperty('--bits', rh - rl + 1);
      for (let bit = rh; bit >= rl; bit--) {
        const label = document.createElement('span'); label.textContent = bit;
        labels.appendChild(label);
        const toggle = document.createElement('button'); toggle.className = 'bit-value';
        toggle.type = 'button';
        toggle.addEventListener('click', () => { value ^= 1n << BigInt(bit); refresh(); });
        bindings.push(() => {
          const on = readField(value, bit, bit) === 1n;
          toggle.textContent = on ? '1' : '0';
          toggle.setAttribute('aria-pressed', String(on));
          toggle.setAttribute('aria-label', `${reg.name} bit ${bit} = ${on ? 1 : 0}，点击翻转`);
        });
        bitValues.appendChild(toggle);
      }
      const row = document.createElement('div'); row.className = 'row';
      row.style.setProperty('--bits', rh - rl + 1);
      cells.forEach((c, i) => {
        const hi = Math.min(c.hi, rh), lo = Math.max(c.lo, rl);
        if (hi < lo) return;
        const d = document.createElement('div');
        const width = hi - lo + 1;
        const isRsv = c.gap || c.f[5];
        const narrow = !c.gap && measure.measureText(c.f[0]).width > width * 32 - 10;
        d.className = 'cell ' + (isRsv ? 'rsv' : 'c' + (i % 5)) + (narrow ? ' narrow' : '');
        d.style.gridColumn = `span ${width}`;
        d.innerHTML = c.gap ? '' : `<span class="cell-label">${esc(c.f[0])}</span><small>${width} bits</small>`;
        if (!c.gap) {
          d.dataset.k = c.f[0] + '_' + c.f[1];
          d.title = `${c.f[0]}[${hi}${hi!==lo?':'+lo:''}] ${c.f[3]}`;
          d.setAttribute('aria-label', d.title);
          if (!isRsv) {
            const output = document.createElement('span'); output.className = 'cell-value';
            d.appendChild(output);
            d.tabIndex = 0; d.setAttribute('role', 'button');
            const activate = () => {
              if (c.f[1] === c.f[2]) { value ^= 1n << BigInt(c.f[2]); refresh(); }
              else editors.get(d.dataset.k).focus();
            };
            d.addEventListener('click', activate);
            d.addEventListener('keydown', event => {
              if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); activate(); }
            });
            bindings.push(() => {
              const fieldValue = readField(value, c.f[1], c.f[2]);
              output.textContent = c.f[1] === c.f[2] ? fieldValue.toString() : '0x' + fieldValue.toString(16);
              d.classList.toggle('nonzero', fieldValue !== 0n);
              d.setAttribute('aria-label', `${d.title}；完整字段值 ${output.textContent}`);
              if (c.f[1] === c.f[2]) d.setAttribute('aria-pressed', String(fieldValue === 1n));
            });
          }
        }
        row.appendChild(d);
      });
      wrap.appendChild(labels);
      wrap.appendChild(bitValues);
      wrap.appendChild(row);
    });
    card.appendChild(wrap);

    const tb = document.createElement('table');
    tb.innerHTML = '<tr><th>位</th><th>字段</th><th>当前值（可编辑）</th><th>说明</th></tr>';
    fs.forEach(f => {
      if (f[5]) return;
      const tr = document.createElement('tr');
      tr.dataset.k = f[0] + '_' + f[1];
      const bits = f[1] === f[2] ? `${f[1]}` : `${f[1]}:${f[2]}`;
      tr.innerHTML = `<td><code>${bits}</code></td><td><b>${esc(f[0])}</b></td>`;
      const valueCell = document.createElement('td');
      const editor = document.createElement('input'); editor.className = 'field-input';
      editor.type = 'text'; editor.spellcheck = false; editor.maxLength = 66;
      editor.setAttribute('aria-label', `${reg.name} ${f[0]} [${bits}] 字段值`);
      editors.set(tr.dataset.k, editor);
      const meaning = document.createElement('span'); meaning.className = 'field-meaning';
      const fieldError = document.createElement('div'); fieldError.className = 'value-error';
      fieldError.id = `${reg.id}-field-${f[1]}-error`;
      fieldError.setAttribute('aria-live', 'polite');
      editor.setAttribute('aria-describedby', fieldError.id);
      editor.addEventListener('input', () => {
        try {
          const next = parseValue(editor.value, f[1] - f[2] + 1);
          value = writeField(value, f[1], f[2], next); refresh(editor);
        } catch (e) { fieldError.textContent = e.message; editor.setAttribute('aria-invalid', 'true'); }
      });
      bindings.push(origin => {
        const fieldValue = readField(value, f[1], f[2]);
        if (origin !== editor) editor.value = f[1] - f[2] < 4 ? fieldValue.toString() : '0x' + fieldValue.toString(16);
        editor.setAttribute('aria-invalid', 'false'); fieldError.textContent = '';
        meaning.textContent = fieldMeaning(reg, f, fieldValue, width);
      });
      valueCell.append(editor, meaning, fieldError);
      const description = document.createElement('td'); description.textContent = f[3];
      tr.append(valueCell, description);
      if (matches(f[0])) tr.style.background = '#fef9c3';
      tb.appendChild(tr);
    });
    const tableWrap = document.createElement('div'); tableWrap.className = 'table-wrap';
    tableWrap.appendChild(tb);
    card.appendChild(tableWrap);
    refresh();
    main.appendChild(card);

    card.querySelectorAll('[data-k]').forEach(el => {
      el.addEventListener('mouseenter', () => card.querySelectorAll(`[data-k="${el.dataset.k}"]`).forEach(e => e.classList.add('hover')));
      el.addEventListener('mouseleave', () => card.querySelectorAll('.hover').forEach(e => e.classList.remove('hover')));
    });
  });
  if (!main.children.length) main.innerHTML = '<div class="card">没有匹配结果</div>';
}

document.getElementById('assignment-form').addEventListener('submit', event => {
  event.preventDefault();
  const input = document.getElementById('assignment');
  const status = document.getElementById('assignment-error');
  try {
    const parsed = parseAssignment(input.value, Number(xlenSel.value));
    registerValues.set(`${parsed.reg.id}:${parsed.width}`, parsed.value);
    sel.value = parsed.reg.id;
    q.value = '';
    render();
    input.setAttribute('aria-invalid', 'false');
    status.textContent = `已解析 ${parsed.reg.id}（${parsed.width} 位），结果见下方。`;
  } catch (error) {
    input.setAttribute('aria-invalid', 'true');
    status.textContent = error.message;
  }
});
[sel, xlenSel].forEach(e => e.addEventListener('change', render));
q.addEventListener('input', () => {
  sel.value = 'all';
  render();
});
render();
</script>
</body>
</html>
