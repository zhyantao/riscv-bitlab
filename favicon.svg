<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RISC-V BitLab">
  <!-- RISC-V 速查工具箱：芯片 + 位域网格，一位深红 -->
  <rect width="64" height="64" fill="#fffff8"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" fill="none" stroke="#111111" stroke-width="1.5"/>
  <!-- 引脚 -->
  <g stroke="#111111" stroke-width="1.5">
    <line x1="22.25" y1="12" x2="22.25" y2="17"/><line x1="28.75" y1="12" x2="28.75" y2="17"/><line x1="35.25" y1="12" x2="35.25" y2="17"/><line x1="41.75" y1="12" x2="41.75" y2="17"/>
    <line x1="22.25" y1="47" x2="22.25" y2="52"/><line x1="28.75" y1="47" x2="28.75" y2="52"/><line x1="35.25" y1="47" x2="35.25" y2="52"/><line x1="41.75" y1="47" x2="41.75" y2="52"/>
    <line x1="12" y1="22.25" x2="17" y2="22.25"/><line x1="12" y1="28.75" x2="17" y2="28.75"/><line x1="12" y1="35.25" x2="17" y2="35.25"/><line x1="12" y1="41.75" x2="17" y2="41.75"/>
    <line x1="47" y1="22.25" x2="52" y2="22.25"/><line x1="47" y1="28.75" x2="52" y2="28.75"/><line x1="47" y1="35.25" x2="52" y2="35.25"/><line x1="47" y1="41.75" x2="52" y2="41.75"/>
  </g>
  <!-- 芯片轮廓 -->
  <rect x="17" y="17" width="30" height="30" fill="#fffff8" stroke="#111111" stroke-width="1.5"/>
  <!-- 位域网格 -->
  <g stroke="#111111" stroke-width="0.75" opacity="0.75">
    <line x1="25.9" y1="21" x2="25.9" y2="43"/>
    <line x1="31.8" y1="21" x2="31.8" y2="43"/>
    <line x1="37.7" y1="21" x2="37.7" y2="43"/>
    <line x1="21" y1="25.9" x2="43" y2="25.9"/>
    <line x1="21" y1="31.8" x2="43" y2="31.8"/>
    <line x1="21" y1="37.7" x2="43" y2="37.7"/>
    <rect x="21" y="21" width="22" height="22" fill="none" stroke-width="1.2"/>
  </g>
  <!-- 置 1 的位 -->
  <rect x="31.8" y="25.9" width="5.9" height="5.9" fill="#a00000"/>
</svg>
